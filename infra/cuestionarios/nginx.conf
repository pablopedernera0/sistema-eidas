server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
    }

    # Solo el webhook del flujo de cuestionarios, no el resto de N8N.
    location = /procesar {
        proxy_pass http://n8n:5678/webhook/procesar-cuestionario;
        proxy_read_timeout 300s;
    }
}
